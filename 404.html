<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Law Office of Shawn McKenna</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
:root{
  --bg:#fcfcfb; --ink:#15181d; --muted:#5b6270; --line:#e3e4e8;
  --accent:#7a5c2e; --accent-soft:#f6f0e4;
  --serif:ui-serif,Georgia,Cambria,"Times New Roman",Times,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1115;--ink:#e9eaee;--muted:#a0a7b5;--line:#262b35;--accent:#d3ac6a;--accent-soft:#221d14}
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;
  background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
main{max-width:34rem;text-align:center}
.code{
  display:inline-block;font-family:var(--mono);font-size:.78rem;letter-spacing:.08em;
  color:var(--accent);background:var(--accent-soft);padding:.3rem .65rem;border-radius:999px;
  margin-bottom:1.2rem
}
h1{font-family:var(--serif);font-size:clamp(1.9rem,5.4vw,2.7rem);letter-spacing:-.03em;line-height:1.1;margin:0 0 .8rem;font-weight:660}
p{color:var(--muted);margin:0 0 2rem}
a.btn{
  display:inline-block;background:var(--accent);color:#fff;text-decoration:none;
  padding:.7rem 1.3rem;border-radius:10px;font-weight:560
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
</style>
</head>
<body>
<main>
  <p class="code">HTTP 404</p>
  <h1>That page doesn&rsquo;t exist.</h1>
  <p>The page you asked for has moved or never existed. Return to the homepage, or call the office if you were looking for something specific.</p>
  <a class="btn" href="/">Return to the homepage</a>
</main>
</body>
</html>
